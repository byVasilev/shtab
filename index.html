<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Штаб союза — переезд</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0c171d;color:#e8f1f2;font:16px/1.5 system-ui,-apple-system,sans-serif;padding:16px;box-sizing:border-box}
  .card{max-width:440px;background:#132631;border-radius:16px;padding:24px;text-align:center}
  h1{font-size:22px;margin:0 0 10px} p{margin:0 0 10px;color:#b9ccd0} .en{font-size:14px;color:#8aa3a8;margin-top:14px}
  button{font:700 16px system-ui;padding:12px 20px;border-radius:12px;border:0;background:#ffc928;color:#2a1f00;margin-top:8px}
</style></head><body><div class="card">
<h1>🛠 Штаб переезжает</h1>
<p>Переносим сайт на новый сервер в Москве. Это займёт около 15 минут — ваши данные сохранены.</p>
<p>Загляните чуть позже или обновите страницу.</p>
<button onclick="location.reload()">Обновить</button>
<p class="en">Moving to a new server, about 15 minutes. Your data is safe — please come back shortly.</p>
</div>
<script>setTimeout(() => location.reload(), 60000);</script>
</body></html>
